name: Check ES fact review

on:
  workflow_dispatch:
    inputs:
      audit_queue:
        description: "Review queued ES facts instead of two controls"
        required: false
        default: "false"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'anthropic>=0.52.0'
      - name: Probe two claims without publishing
        if: inputs.audit_queue != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_es_fact_review.py
      - name: Audit queued claims without publishing
        if: inputs.audit_queue == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_es_fact_review.py --queue
