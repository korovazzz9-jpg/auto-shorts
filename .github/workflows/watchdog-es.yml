name: Daily Shorts Watchdog (ES)

on:
  # 15 минут после каждого слота в daily-es.yml (13:17/17:17/20:17/22:17/00:17 UTC).
  # 2026-07-09: добавлен по аналогии с watchdog.yml (EN) — до этого у ES не было
  # подстраховки на пропущенный/упавший слот (реальный инцидент: ES 03:17 упал
  # 2026-07-09, слот потерян без возможности ретрая).
  schedule:
    # 2026-07-13/14 слоты 16:17 и 20:17 убирались (подавление раздачи ES) — их cron'ы
    # удалялись, иначе watchdog "доливал" бы удалённые слоты обратно.
    # 2026-07-16: слоты ВОССТАНОВЛЕНЫ (4/день, подавление прошло) — cron'ы возвращены.
    # 2026-07-17: 16:32→13:32 вслед за слотом 16:17→13:17 (см. config.py).
    # 2026-09-07: 4→5 слотов, 03:32 убран, добавлены 17:32 и 22:32 (см. config.py — слот
    # 03:17 был худшим: 23:17 US-East / 21:17 MX, хвост ночи для 87% аудитории в Америках).
    - cron: "32 13 * * *"
    - cron: "32 17 * * *"
    - cron: "32 20 * * *"
    - cron: "32 22 * * *"
    - cron: "32 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-es
  cancel-in-progress: false

permissions:
  actions: read
  contents: write   # ретрай пайплайна берёт сценарий из queue_es.json — его надо закоммитить обратно

jobs:
  check-and-retry:
    runs-on: ubuntu-latest
    steps:
      # 2026-07-13: ждём завершения живого прогона вместо немедленного skip — см. watchdog.yml
      # (реальный промах 12.07: guard пришёл за 5 секунд до конца ПАДАЮЩЕГО прогона).
      - name: Wait for in-flight daily-es run, then decide
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 16); do
            running=$(gh run list --workflow=daily-es.yml --repo=${{ github.repository }} \
              --status=in_progress --limit=5 --json databaseId --jq 'length')
            [ "$running" -eq 0 ] && break
            echo "Daily-ES pipeline is in progress — waiting 30s ($i/16)..."
            sleep 30
          done
          if [ "$running" -gt 0 ]; then
            echo "Daily-ES still running after 8 min — real long render, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: master
        if: steps.guard.outputs.skip == 'false'

      - name: Restore stock search cache
        uses: actions/cache/restore@v4
        with:
          path: src/stock_search_cache.json
          key: stock-search-es-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stock-search-es-

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: "3.11"

      - name: Install Python deps
        if: steps.guard.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: Check for recent upload
        if: steps.guard.outputs.skip == 'false'
        id: check
        working-directory: src
        env:
          CHANNEL: es
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # 2026-07-17: свой OAuth-клиент на канал (лимит Google — 50 живых токенов
          # на client_id+аккаунт; общий client_id вытеснял чужие токены).
          # Секрет не заведён => _client_pair() падает на общие выше.
          YT_CLIENT_ID_ES: ${{ secrets.YT_CLIENT_ID_ES }}
          YT_CLIENT_SECRET_ES: ${{ secrets.YT_CLIENT_SECRET_ES }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_ES }}
        run: |
          if python check_recent_upload.py; then
            echo "missed=false" >> "$GITHUB_OUTPUT"
          else
            echo "missed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system deps (only if retry needed)
        if: steps.guard.outputs.skip == 'false' && steps.check.outputs.missed == 'true'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Allow ImageMagick to read caption text files (only if retry needed)
        if: steps.guard.outputs.skip == 'false' && steps.check.outputs.missed == 'true'
        run: sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml

      - name: Retry pipeline (scheduled run was missed)
        if: steps.guard.outputs.skip == 'false' && steps.check.outputs.missed == 'true'
        working-directory: src
        env:
          CHANNEL: es
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # 2026-07-17: свой OAuth-клиент на канал (лимит Google — 50 живых токенов
          # на client_id+аккаунт; общий client_id вытеснял чужие токены).
          # Секрет не заведён => _client_pair() падает на общие выше.
          YT_CLIENT_ID_ES: ${{ secrets.YT_CLIENT_ID_ES }}
          YT_CLIENT_SECRET_ES: ${{ secrets.YT_CLIENT_SECRET_ES }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_ES }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_ES }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_ES }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline.py

      # Тот же шаг, что в daily-es.yml: pipeline.py мог взять сценарий из queue_es.json
      # (Batch API preload) — без коммита следующий запуск увидел бы несдвинутую очередь
      # и опубликовал бы ТОТ ЖЕ сценарий второй раз.
      - name: Save recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery_es.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist queue state
        if: always() && steps.guard.outputs.skip == 'false' && steps.check.outputs.missed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f recovery_es.json ] && git add recovery_es.json
          [ -f queue_es.json ] && git add queue_es.json
          [ -f ig_card_counter_es.json ] && git add ig_card_counter_es.json
          [ -f video_history_es.json ] && git add video_history_es.json
          [ -f paired_facts_es.json ] && git add paired_facts_es.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore(queue): ES queue/card state (watchdog retry) $(date -u +%F)" || { echo "no changes"; exit 0; }
          git pull --rebase origin master
          git push

      - name: Save stock search cache
        if: always() && hashFiles('src/stock_search_cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: src/stock_search_cache.json
          key: stock-search-es-${{ github.run_id }}-${{ github.run_attempt }}
